  <text x="120" y="770" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="32" fill="#94A3B8">Python &#183; Mistral 7B &#183; FAISS + BM25 &#183; FastAPI &#183; Streamlit</text>
