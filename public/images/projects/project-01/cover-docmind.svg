<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="DocMind — Local RAG pipeline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1F"/>
      <stop offset="1" stop-color="#0C1836"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.4" fill="#38BDF8"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)" opacity="0.07"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g stroke="url(#accent)" stroke-width="3" fill="none" opacity="0.5">
    <circle cx="1250" cy="300" r="132"/>
    <circle cx="1250" cy="300" r="82"/>
  </g>
  <g fill="#22D3EE" opacity="0.9">
    <circle cx="1250" cy="168" r="12"/>
    <circle cx="1382" cy="300" r="12"/>
    <circle cx="1250" cy="432" r="12"/>
    <circle cx="1118" cy="300" r="12"/>
  </g>
  <rect x="120" y="250" width="120" height="8" rx="4" fill="url(#accent)"/>
  <text x="120" y="322" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="32" letter-spacing="6" fill="#38BDF8" font-weight="600">RAG &#183; LLM</text>
  <text x="116" y="472" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="112" fill="#F8FAFC" font-weight="800">DocMind</text>
  <text x="120" y="550" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="40" fill="#CBD5E1">Local RAG pipeline &#8212; chat with your PDFs, fully on-device</text>
